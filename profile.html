<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oyuncu Profili</title>
<style>
:root{
  --bg:#020617; --card:#111827; --card2:#172033; --line:#263247;
  --orange:#f97316; --green:#22c55e; --red:#ef4444; --yellow:#facc15;
  --muted:#9ca3af; --text:#f8fafc;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);

  background:
    linear-gradient(rgba(2,6,23,.82), rgba(2,6,23,.88)),
    url('bg.jpg');

  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}
.container{width:min(1150px,94%); margin:0 auto; padding:24px 0 60px}
.back{display:inline-block; color:#fb923c; font-weight:800; margin-bottom:16px; cursor:pointer}
.hero{
  background:linear-gradient(135deg,rgba(249,115,22,.18),rgba(17,24,39,.95));
  border:1px solid var(--line); border-radius:22px; padding:26px; box-shadow:0 18px 60px rgba(0,0,0,.28);
}
.hero.overall-bronze{background:linear-gradient(135deg,rgba(120,72,38,.28),rgba(17,24,39,.95));border-color:#92400e}
.hero.overall-silver{background:linear-gradient(135deg,rgba(148,163,184,.24),rgba(17,24,39,.95));border-color:#94a3b8}
.hero.overall-gold{background:linear-gradient(135deg,rgba(250,204,21,.24),rgba(17,24,39,.95));border-color:#facc15}
.hero.overall-platinum{background:linear-gradient(135deg,rgba(34,211,238,.22),rgba(17,24,39,.95));border-color:#22d3ee}
.hero.overall-diamond{background:linear-gradient(135deg,rgba(96,165,250,.25),rgba(17,24,39,.95));border-color:#60a5fa}
.hero.overall-immortal{background:linear-gradient(135deg,rgba(168,85,247,.28),rgba(17,24,39,.95));border-color:#a855f7}
.overall-badge{
  display:inline-block;
  color:white;
  background:linear-gradient(135deg,#f97316,#c2410c);
  border:1px solid #fb923c;
  border-radius:999px;
  padding:8px 12px;
  font-size:14px;
  font-weight:900;
}
.rank-badge{
  display:inline-block;
  color:white;
  border-radius:999px;
  padding:8px 12px;
  font-size:14px;
  font-weight:900;
  border:1px solid var(--line);
}
.rank-bronze{background:rgba(120,72,38,.45);border-color:#92400e}
.rank-silver{background:rgba(148,163,184,.35);border-color:#94a3b8}
.rank-gold{background:rgba(250,204,21,.28);border-color:#facc15}
.rank-platinum{background:rgba(34,211,238,.25);border-color:#22d3ee}
.rank-diamond{background:rgba(96,165,250,.30);border-color:#60a5fa}
.rank-immortal{background:rgba(168,85,247,.35);border-color:#a855f7}
.name{font-size:34px; font-weight:900; color:#fb923c; display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.steam-link{
  display:inline-block;
  text-decoration:none;
  color:white;
  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  border:1px solid #60a5fa;
  border-radius:999px;
  padding:8px 12px;
  font-size:14px;
  font-weight:900;
  transition:.18s;
}
.steam-link:hover{transform:translateY(-2px); box-shadow:0 0 18px rgba(96,165,250,.35)}
.filter-row{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 0}
.filter-btn{
  border:1px solid var(--line);
  color:white;
  background:#0b1220;
  border-radius:12px;
  padding:11px 14px;
  font-weight:900;
  cursor:pointer;
  transition:.18s;
}
.filter-btn:hover{border-color:var(--orange);transform:translateY(-2px)}
.filter-btn.active{background:linear-gradient(135deg,#f97316,#c2410c);border-color:#fb923c}
.meta{margin-top:8px; color:#cbd5e1; font-weight:700}
.grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-top:18px}
.stat{
  background:rgba(17,24,39,.88); border:1px solid var(--line); border-radius:16px;
  padding:16px; text-align:center; transition:.18s;
}
.stat:hover{transform:translateY(-3px); border-color:#fb923c}
.value{font-size:24px; font-weight:900}
.label{color:var(--muted); margin-top:6px}
.section-title{margin:30px 0 14px}
.history{display:grid; gap:10px}
.match{
  background:rgba(17,24,39,.88); border:1px solid var(--line); border-radius:16px;
  padding:14px; display:grid; grid-template-columns:1fr auto; gap:12px; align-items:center;
  cursor:pointer; transition:.18s;
}
.match:hover{transform:translateY(-2px); border-color:#fb923c}
.small{color:var(--muted); font-size:13px}
.score-pill{font-weight:900; padding:7px 10px; border-radius:999px; background:rgba(249,115,22,.16); color:#fb923c}
.wr-good{color:var(--green);font-weight:900}
.wr-mid{color:var(--yellow);font-weight:900}
.wr-bad{color:var(--red);font-weight:900}
.wl-box{white-space:nowrap;font-weight:900}
.win-text{color:var(--green)}
.loss-text{color:var(--red)}
.result-win{color:var(--green);font-weight:900}
.result-lose{color:var(--red);font-weight:900}
.result-draw{color:var(--yellow);font-weight:900}
@media(max-width:650px){.match{grid-template-columns:1fr}.name{font-size:26px}}

@media(max-width:768px){
  .container{width:98%!important;padding:12px 0 40px!important}
  .toolbar,.builder-head,.builder-controls,.filter-row,.matches-toggle-row{
    flex-direction:column!important;
    align-items:stretch!important;
  }
  .filter-btn,.build-btn,.clear-btn,.toggle-btn,.select-mode,.search{
    width:100%!important;
  }
  .player-pills{grid-template-columns:repeat(2,minmax(0,1fr))!important;}
  .matches{grid-template-columns:1fr!important;}
  table{font-size:12px}
  th,td{padding:8px 6px}
}

</style>
</head>
<body>
<div class="container">
  <div class="back" onclick="location.href='index.html'">← Geri</div>

  <div class="hero" id="heroCard">
    <div class="name" id="name">Yükleniyor...</div>
    <div class="meta" id="meta"></div>
    <div class="filter-row">
      <button id="allProfileBtn" class="filter-btn active" onclick="setProfileMode('all')">Tüm Maçlar</button>
      <button id="last10ProfileBtn" class="filter-btn" onclick="setProfileMode('last10')">Son 10 Maç</button>
      <button id="last20ProfileBtn" class="filter-btn" onclick="setProfileMode('last20')">Son 20 Maç</button>
    </div>
    <div class="grid" id="stats"></div>
  </div>

  <h2 class="section-title">📜 Match History</h2>
  <div id="history" class="history"></div>
</div>

<script>

const NAME_FIX = {
  "steam_301208272": "RAİDER",
  "301208272": "RAİDER",
  "steam_141469239": "RBZ",
  "141469239": "RBZ",
  "RIKU": "RAIKU",
  "RAIKU": "RAIKU",
  "elbombas15Saniye": "elbombası"
};
function displayName(name){
  return NAME_FIX[name] || name;
}

function steamProfileUrl(steamId){
  if(!steamId) return "";
  const id = String(steamId).trim();

  if(id.length >= 16 && id.startsWith("7656119")){
    return "https://steamcommunity.com/profiles/" + id;
  }

  const base = BigInt("76561197960265728");
  const accountId = BigInt(id);
  return "https://steamcommunity.com/profiles/" + (base + accountId).toString();
}

const playerName = new URLSearchParams(location.search).get("player");

let profilePlayer = null;
let profileExtra = null;
let matchDetails = [];
let profileMode = "all";

Promise.all([
  fetch("players.json").then(r=>r.json()),
  fetch("players_extra.json").then(r=>r.json()),
  fetch("match_details.json").then(r=>r.json()).catch(()=>[])
]).then(([players, extras, details])=>{
  profilePlayer = players.find(x=>x.name === playerName);
  profileExtra = extras.find(x=>x.name === playerName);
  matchDetails = details || [];

  if(!profilePlayer){
    document.getElementById("name").innerText = "Oyuncu bulunamadı";
    return;
  }

  const shown = displayName(profilePlayer.name);
  document.title = shown + " Profili";

  const steamButton = profilePlayer.steam_id
    ? `<a class="steam-link" target="_blank" href="${steamProfileUrl(profilePlayer.steam_id)}">Steam Profili</a>`
    : "";

  document.getElementById("name").innerHTML = `🔫 ${shown} ${steamButton}`;
  renderProfile("all");
});


function wrClass(wr){
  const v = Number(wr || 0);
  if(v >= 60) return "wr-good";
  if(v >= 45) return "wr-mid";
  return "wr-bad";
}

function resultClass(result){
  if(result === "WIN") return "result-win";
  if(result === "LOSE") return "result-lose";
  return "result-draw";
}

function matchNumber(matchName){
  const nums = String(matchName || "").match(/\d+/g);
  if(!nums || !nums.length) return 0;
  return Number(nums[0]);
}

function matchRoundsFromScore(score){
  const parts = String(score || "").split("-");
  if(parts.length !== 2) return 0;
  return Number(parts[0] || 0) + Number(parts[1] || 0);
}

function playerMvpScore(p){
  const clutchWins = Number(p.clutch_1v1_wins || 0) + Number(p.clutch_1v2_wins || 0);
  return (
    Number(p.kills || 0) * 2 +
    Number(p.assists || 0) +
    Number(p.damage || 0) / 100 +
    Number(p.entry_wins || 0) * 2 +
    clutchWins * 3 -
    Number(p.deaths || 0)
  );
}


function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

function normalize(v,min,max){
  const n = (Number(v || 0) - min) / (max - min);
  return clamp(n,0,1);
}

function overallRank(score){
  if(score < 45) return "Bronze";
  if(score < 60) return "Silver";
  if(score < 72) return "Gold";
  if(score < 84) return "Platinum";
  if(score < 92) return "Diamond";
  return "Immortal";
}

function rankClass(rank){
  return "rank-" + String(rank || "Bronze").toLowerCase();
}

function heroClass(rank){
  return "overall-" + String(rank || "Bronze").toLowerCase();
}

function calculateOverallFromStats(st){
  const adrScore = normalize(st.adr, 45, 115);
  const kdaScore = normalize(st.kda, 0.8, 2.4);
  const wrScore = normalize(st.wr, 25, 75);

  const matches = Math.max(Number(st.matches || 1), 1);
  const edoPerMatch = Number(st.roundEdo || 0) / matches;
  const edoScore = normalize(edoPerMatch, 0, 3.2);

  const clutchTotal = Number(st.clutchCount || 0);
  const clutchWins = Number(st.clutchWins || 0);
  const clutchScore = clutchTotal ? clutchWins / clutchTotal : 0;

  const entryTotal = Number(st.entryCount || 0);
  const entryWins = Number(st.entryWins || 0);
  const entryScore = entryTotal ? entryWins / entryTotal : 0;

  const total =
    adrScore * 35 +
    kdaScore * 25 +
    wrScore * 15 +
    edoScore * 15 +
    entryScore * 5 +
    clutchScore * 5;

  return Math.round(total);
}

function collectPlayerMatches(limitMode){
  let appearances = [];

  (matchDetails || []).forEach(m=>{
    const all = [...(m.team1_players || []), ...(m.team2_players || [])];
    const found = all.find(p => p.name === playerName || displayName(p.name) === displayName(playerName));
    if(found){
      appearances.push({match:m, player:found});
    }
  });

  appearances.sort((a,b)=>matchNumber(b.match.match)-matchNumber(a.match.match));

  if(limitMode === "last10") return appearances.slice(0,10);
  if(limitMode === "last20") return appearances.slice(0,20);
  return appearances;
}

function calcStatsFromAppearances(appearances){
  let kills = 0, deaths = 0, assists = 0, damage = 0, hs = 0, rounds = 0;
  let utilityDamage = 0, flashCount = 0, flashSuccess = 0, entryCount = 0, entryWins = 0;
  let c1Count = 0, c1Wins = 0, c2Count = 0, c2Wins = 0;
  let edo = 0;
  let roundEdo = 0;
  let wins = 0;

  appearances.forEach(({match, player})=>{
    kills += Number(player.kills || 0);
    deaths += Number(player.deaths || 0);
    assists += Number(player.assists || 0);
    damage += Number(player.damage || 0);
    hs += Number(player.headshot_kills || 0);
    rounds += Number(match.rounds || matchRoundsFromScore(match.score) || 0);

    utilityDamage += Number(player.utility_damage || 0);
    flashCount += Number(player.flash_count || 0);
    flashSuccess += Number(player.flash_successes || 0);
    entryCount += Number(player.entry_count || 0);
    entryWins += Number(player.entry_wins || 0);

    c1Count += Number(player.clutch_1v1_count || 0);
    c1Wins += Number(player.clutch_1v1_wins || 0);
    c2Count += Number(player.clutch_1v2_count || 0);
    c2Wins += Number(player.clutch_1v2_wins || 0);
    roundEdo += Number(player.mvps || player.round_edo || 0);

    const playerTeamScore = Number(player.team || 0) === 1 ? Number(match.team1_score || 0) : Number(match.team2_score || 0);
    const opponentTeamScore = Number(player.team || 0) === 1 ? Number(match.team2_score || 0) : Number(match.team1_score || 0);
    if(playerTeamScore > opponentTeamScore) wins += 1;

    const all = [...(match.team1_players || []), ...(match.team2_players || [])];
    let best = null;
    let bestScore = -999999;

    all.forEach(p=>{
      const score = playerMvpScore(p);
      if(score > bestScore){
        bestScore = score;
        best = p.name;
      }
    });

    if(best === player.name) edo += 1;
  });

  const kd = deaths ? Number((kills/deaths).toFixed(2)) : kills;
  const kda = deaths ? Number(((kills+assists)/deaths).toFixed(2)) : kills + assists;
  const adr = rounds ? Number((damage/rounds).toFixed(1)) : 0;
  const hsPercent = kills ? Number(((hs/kills)*100).toFixed(1)) : 0;
  const flashRate = flashCount ? Number(((flashSuccess/flashCount)*100).toFixed(1)) : 0;
  const entryRate = entryCount ? Number(((entryWins/entryCount)*100).toFixed(1)) : 0;
  const losses = Math.max(appearances.length - wins, 0);
  const wr = appearances.length ? Number(((wins / appearances.length) * 100).toFixed(1)) : 0;

  return {
    matches: appearances.length,
    wins, losses, wr,
    rounds, kills, deaths, assists, damage,
    kd, kda, adr, hsPercent, utilityDamage,
    flashRate, entryRate,
    entryCount, entryWins,
    clutchWins: c1Wins + c2Wins,
    clutchCount: c1Count + c2Count,
    clutch1: `${c1Wins}/${c1Count}`,
    clutch2: `${c2Wins}/${c2Count}`,
    clutchTotal: `${c1Wins+c2Wins}/${c1Count+c2Count}`,
    edo,
    roundEdo
  };
}

function setProfileMode(mode){
  renderProfile(mode);
}

function renderProfile(mode){
  profileMode = mode;

  document.getElementById("allProfileBtn").classList.toggle("active", mode === "all");
  document.getElementById("last10ProfileBtn").classList.toggle("active", mode === "last10");
  document.getElementById("last20ProfileBtn").classList.toggle("active", mode === "last20");

  const appearances = collectPlayerMatches(mode);
  const st = calcStatsFromAppearances(appearances);
  const overall = calculateOverallFromStats(st);
  const rank = overallRank(overall);

  const hero = document.getElementById("heroCard");
  hero.className = "hero " + heroClass(rank);

  document.getElementById("meta").innerHTML = `${st.matches} maç • ${st.rounds} round • <span class="overall-badge">⚡ Overall ${overall}</span> <span class="rank-badge ${rankClass(rank)}">${rank}</span> • <span class="${wrClass(st.wr)}">WR %${st.wr}</span>`;

  const stats = [
    ["Overall", "⚡ " + overall],
    ["Rank", rank],
    ["W/L", `<span class="win-text">${st.wins}</span>/<span class="loss-text">${st.losses}</span>`],
    ["WR", `<span class="${wrClass(st.wr)}">%${st.wr}</span>`],
    ["K/D", st.kd], ["KDA", st.kda], ["ADR", st.adr], ["Matches", st.matches],
    ["HS%", st.hsPercent + "%"], ["Kills", st.kills],
    ["Assists", st.assists], ["Deaths", st.deaths],
    ["MVP", "🏆 " + st.edo],
    ["Round EDO", "⭐ " + st.roundEdo],
    ["1v1 Clutch", st.clutch1],
    ["1v2 Clutch", st.clutch2],
    ["Toplam Clutch", st.clutchTotal],
    ["Utility DMG", st.utilityDamage],
    ["Flash Başarı", "%" + st.flashRate],
    ["Entry Başarı", "%" + st.entryRate]
  ];

  document.getElementById("stats").innerHTML = stats.map(s=>`
    <div class="stat"><div class="value">${s[1]}</div><div class="label">${s[0]}</div></div>
  `).join("");

  const history = (profileExtra?.match_history || [])
    .slice()
    .sort((a,b)=>matchNumber(b.match)-matchNumber(a.match));

  document.getElementById("history").innerHTML = history.map(m=>{
    return `
      <div class="match" onclick="location.href='match.html?match=${encodeURIComponent(m.match)}'">
        <div>
          <b>${m.match}</b> <span class="small">(${m.score})</span> <span class="${resultClass(m.result)}">${m.result || ""}</span>
          <div class="small">K/D/A: ${m.kills}/${m.deaths}/${m.assists} • KDA: ${m.deaths ? Number(((Number(m.kills||0)+Number(m.assists||0))/Number(m.deaths)).toFixed(2)) : Number(m.kills||0)+Number(m.assists||0)} • DMG: ${m.damage} • KD: ${m.kd}</div>
        </div>
        <div class="score-pill ${resultClass(m.result)}">${m.result || m.score}</div>
      </div>`;
  }).join("");
}
</script>
</body>
</html>
