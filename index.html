<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS2 Konya Ligi</title>
<style>
:root{
  --bg:#050914; --card:#111827; --card2:#172033; --line:#263247;
  --orange:#f97316; --green:#22c55e; --red:#ef4444; --yellow:#facc15;
  --muted:#9ca3af; --text:#f8fafc;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:
    linear-gradient(rgba(2,6,23,.82), rgba(2,6,23,.88)),
    url('bg.jpg');
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}
.container{width:min(1200px,94%); margin:0 auto; padding:26px 0 60px}
.header{text-align:center; padding:22px 0 18px}
.header h1{margin:0; color:var(--orange); letter-spacing:.8px; font-size:34px}
.sub{color:var(--muted); margin-top:8px}
.toolbar{display:flex; gap:10px; justify-content:space-between; align-items:center; margin:22px 0}
.search{flex:1; background:rgba(17,24,39,.85); border:1px solid var(--line); color:white; border-radius:12px; padding:13px 15px; outline:none}
.card{background:rgba(17,24,39,.88); border:1px solid var(--line); border-radius:18px; overflow:hidden; box-shadow:0 18px 50px rgba(0,0,0,.25)}
table{width:100%; border-collapse:collapse}
th,td{padding:14px 12px; text-align:center; border-bottom:1px solid rgba(38,50,71,.7)}
th{background:#0b1220; color:#cbd5e1; cursor:pointer; user-select:none; font-size:13px}
td{font-weight:700}
tr{transition:.18s}
tbody tr:hover{background:rgba(249,115,22,.12); transform:scale(1.006); cursor:pointer}
.player{text-align:left}
.good{color:var(--green)} .bad{color:var(--red)} .mid{color:var(--yellow)}
.wr-good{color:var(--green);font-weight:900}
.wr-mid{color:var(--yellow);font-weight:900}
.wr-bad{color:var(--red);font-weight:900}
.wl-box{white-space:nowrap;font-weight:900}
.win-text{color:var(--green)}
.loss-text{color:var(--red)}
.rank-badge{
  display:inline-block;
  margin-top:4px;
  font-size:11px;
  padding:4px 8px;
  border-radius:999px;
  background:rgba(249,115,22,.16);
  color:#fb923c;
  font-weight:900;
}
.section-title{margin:34px 0 14px; font-size:24px}
.matches{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px}
.match-card{background:rgba(17,24,39,.88); border:1px solid var(--line); border-radius:16px; padding:14px; transition:.18s; cursor:pointer}
.match-card:hover{transform:translateY(-3px); border-color:var(--orange); box-shadow:0 0 18px rgba(249,115,22,.25)}
.match-top{display:flex; justify-content:space-between; gap:10px; align-items:center}
.match-name{font-weight:900; color:white}
.score{font-weight:900; color:var(--orange); font-size:20px}
.meta{color:var(--muted); font-size:13px; margin-top:8px}
.winner{margin-top:10px; color:var(--green); font-weight:800}
.filter-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin:0 0 14px}
.filter-btn{border:1px solid var(--line);color:white;background:#0b1220;border-radius:12px;padding:11px 14px;font-weight:900;cursor:pointer;transition:.18s}
.filter-btn:hover{border-color:var(--orange);transform:translateY(-2px)}
.filter-btn.active{background:linear-gradient(135deg,#f97316,#c2410c);border-color:#fb923c}
.team-builder{margin:28px 0 10px;background:rgba(17,24,39,.88);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.builder-head{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.builder-title{font-size:24px;font-weight:900;color:#fb923c}
.builder-sub{color:var(--muted);margin-top:5px;font-size:13px}
.builder-controls{display:flex;gap:10px;flex-wrap:wrap}
.select-mode,.build-btn,.clear-btn,.toggle-btn{border:1px solid var(--line);color:white;background:#0b1220;border-radius:12px;padding:11px 13px;font-weight:800;cursor:pointer;transition:.18s}
.select-mode:hover,.build-btn:hover,.clear-btn:hover,.toggle-btn:hover{border-color:var(--orange);transform:translateY(-2px)}
.build-btn{background:linear-gradient(135deg,#f97316,#c2410c);border-color:#fb923c}
.clear-btn{background:rgba(239,68,68,.13)}
.selected-count{margin:14px 0 10px;color:#cbd5e1;font-weight:800}
.player-pills{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.player-pill{background:rgba(15,23,42,.95);border:1px solid var(--line);border-radius:14px;padding:11px;cursor:pointer;transition:.18s}
.player-pill:hover{transform:translateY(-2px);border-color:#fb923c;background:rgba(249,115,22,.13)}
.player-pill.active{border-color:#22c55e;background:rgba(34,197,94,.14);box-shadow:0 0 18px rgba(34,197,94,.18)}
.pill-name{font-weight:900}
.pill-stat{margin-top:5px;color:var(--muted);font-size:12px}
.builder-message{margin-top:12px;color:#facc15;font-weight:800}
.teams-output{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:16px}
.generated-team{background:rgba(2,6,23,.5);border:1px solid var(--line);border-radius:18px;padding:14px}
.generated-team h3{margin:0 0 10px;color:#fb923c}
.team-line{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid rgba(38,50,71,.55)}
.team-line:last-child{border-bottom:0}
.team-avg{margin-top:10px;font-weight:900;color:#22c55e}
.matches-toggle-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:34px 0 14px}
.matches-toggle-row .section-title{margin:0}
.matches.collapsed{display:none}
@media(max-width:720px){
  th:nth-child(8),td:nth-child(8),th:nth-child(9),td:nth-child(9),th:nth-child(10),td:nth-child(10),th:nth-child(11),td:nth-child(11),th:nth-child(12),td:nth-child(12){display:none}
  .header h1{font-size:26px}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🏆 CS2 KONYA LİGİ</h1>
    <div class="sub">Oyuncu sıralaması, maç geçmişi ve detaylı istatistikler</div>
  </div>

  <div class="toolbar">
    <input id="search" class="search" placeholder="Oyuncu ara...">
  </div>

  <div class="filter-row">
    <button id="allStatsBtn" class="filter-btn active" onclick="setStatsMode('all')">Tüm Maçlar</button>
    <button id="last10StatsBtn" class="filter-btn" onclick="setStatsMode('last10')">Son 10 Maç</button>
    <button id="last20StatsBtn" class="filter-btn" onclick="setStatsMode('last20')">Son 20 Maç</button>
  </div>

  <div class="card">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th class="player">Oyuncu</th>
          <th onclick="sortBy('adr')">ADR</th>
          <th onclick="sortBy('kd')">K/D</th>
          <th onclick="sortBy('matches')">Maç</th>
          <th onclick="sortBy('wins')">W/L</th>
          <th onclick="sortBy('wr')">WR</th>
          <th onclick="sortBy('hs_percent')">HS%</th>
          <th onclick="sortBy('edo')">MVP</th>
          <th onclick="sortBy('round_edo')">Round EDO</th>
          <th onclick="sortBy('clutch_rate')">Clutch</th>
          <th onclick="sortBy('rounds')">Rounds</th>
          <th onclick="sortBy('overall')">Overall</th>
        </tr>
      </thead>
      <tbody id="playersBody"></tbody>
    </table>
  </div>

  <div class="team-builder">
    <div class="builder-head">
      <div>
        <div class="builder-title">⚖️ Takım Kurucu</div>
        <div class="builder-sub">10 oyuncu seç, ADR veya K/D kriterini seç, dengeli 5v5 oluştur.</div>
      </div>
      <div class="builder-controls">
        <select id="balanceMode" class="select-mode">
          <option value="">Kriter seç</option>
          <option value="adr">ADR'ye göre</option>
          <option value="kd">K/D'ye göre</option>
          <option value="overall">Overall'a göre</option>
        </select>
        <select id="edoBalanceMode" class="select-mode">
          <option value="without">EDO'suz</option>
          <option value="with">EDO'lu</option>
        </select>
        <select id="wrBalanceMode" class="select-mode">
          <option value="without">WR'siz</option>
          <option value="with">WR'li</option>
        </select>
        <button class="build-btn" onclick="buildTeams()">Oluştur</button>
        <button class="clear-btn" onclick="clearSelection()">Temizle</button>
      </div>
    </div>

    <div class="filter-row" style="justify-content:flex-start;margin-top:14px;">
      <button id="builderAllBtn" class="filter-btn active" onclick="setBuilderMode('all')">Tüm Maçlar</button>
      <button id="builderLast10Btn" class="filter-btn" onclick="setBuilderMode('last10')">Son 10 Maç</button>
      <button id="builderLast20Btn" class="filter-btn" onclick="setBuilderMode('last20')">Son 20 Maç</button>
    </div>

    <div id="selectedCount" class="selected-count">Seçilen oyuncu: 0/10</div>
    <div id="builderMessage" class="builder-message"></div>
    <div id="playerPills" class="player-pills"></div>
    <div id="teamsOutput" class="teams-output"></div>
  </div>

  <div class="matches-toggle-row">
    <h2 class="section-title">🎮 Maçlar</h2>
    <button id="matchesToggle" class="toggle-btn" onclick="toggleMatches()">Maçları Göster</button>
  </div>
  <div id="matches" class="matches collapsed"></div>
</div>

<script>
const NAME_FIX = {
  "steam_301208272": "RAİDER",
  "301208272": "RAİDER",
  "steam_141469239": "RBZ",
  "141469239": "RBZ",
  "elbombas15Saniye": "elbombası"
};
function displayName(name){ return NAME_FIX[name] || name; }

let allPlayers = [];
let currentPlayers = [];
let filtered = [];
let matchesData = [];
let matchDetailsData = [];
let last10Players = [];
let last20Players = [];
let selectedPlayers = [];
let currentSort = "adr";
let asc = false;
let statsMode = "all";
let builderMode = "all";

Promise.all([
  fetch("players.json").then(r=>r.json()),
  fetch("matches.json").then(r=>r.json()),
  fetch("match_details.json").then(r=>r.json()).catch(()=>[])
]).then(([p,m,d])=>{
  matchesData = m || [];
  matchDetailsData = d || [];

  const allAwards = buildHtmlAwards(p || [], matchDetailsData);
  allPlayers = enrichOverall(enrichPlayersWithAwards(p || [], allAwards));

  last10Players = buildLast10Players(allPlayers, matchDetailsData);
  const last10Awards = buildHtmlAwards(last10Players, getLast10Details(matchDetailsData));
  last10Players = enrichOverall(enrichPlayersWithAwards(last10Players, last10Awards));

  last20Players = buildLast20Players(allPlayers, matchDetailsData);
  const last20Awards = buildHtmlAwards(last20Players, getLast20Details(matchDetailsData));
  last20Players = enrichOverall(enrichPlayersWithAwards(last20Players, last20Awards));

  currentPlayers = allPlayers;
  filtered = [...currentPlayers];
  sortBy("overall", true);
  renderBuilderPlayers();
  renderMatches(matchesData);
});

function safe(v, fallback=""){ return (v===undefined || v===null || Number.isNaN(v)) ? fallback : v; }

function winsOf(p){ return Number(p.wins || 0); }

function lossesOf(p){
  return Math.max(Number(p.matches || 0) - winsOf(p), 0);
}

function wrOf(p){
  const matches = Number(p.matches || 0);
  if(!matches) return 0;
  if(p.wr !== undefined) return Number(p.wr || 0);
  if(p.winrate !== undefined) return Number(p.winrate || 0);
  return Number(((winsOf(p) / matches) * 100).toFixed(1));
}

function wrClass(wr){
  const v = Number(wr || 0);
  if(v >= 60) return "wr-good";
  if(v >= 45) return "wr-mid";
  return "wr-bad";
}


function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

function normalize(v,min,max){
  const n = (Number(v || 0) - min) / (max - min);
  return clamp(n,0,1);
}

function clutchScore(p){
  const wins = Number(p.clutch_wins || 0);
  const count = Number(p.clutch_count || 0);
  if(!count) return 0;
  return wins / count;
}

function entryScore(p){
  const wins = Number(p.entry_wins || 0);
  const count = Number(p.entry_count || 0);
  if(!count) return 0;
  return wins / count;
}

function overallRank(score){
  if(score < 45) return "Bronze";
  if(score < 60) return "Silver";
  if(score < 72) return "Gold";
  if(score < 84) return "Platinum";
  if(score < 92) return "Diamond";
  return "Immortal";
}

function calculateOverall(p){
  const adrScore = normalize(p.adr, 45, 115);
  const kdScore = normalize(p.kd, 0.55, 1.75);
  const wrScore = normalize(wrOf(p), 25, 75);

  const matches = Math.max(Number(p.matches || 1), 1);
  const edoPerMatch = Number(p.round_edo ?? p.mvps ?? 0) / matches;
  const edoScore = normalize(edoPerMatch, 0, 3.2);

  const clutch = clutchScore(p);
  const entry = entryScore(p);

  const total =
    adrScore * 35 +
    kdScore * 25 +
    wrScore * 20 +
    edoScore * 10 +
    entry * 5 +
    clutch * 5;

  return Math.round(total);
}

function enrichOverall(players){
  return (players || []).map(p=>{
    const overall = calculateOverall(p);
    return {
      ...p,
      wins: winsOf(p),
      losses: lossesOf(p),
      wr: wrOf(p),
      overall,
      elo: overall,
      rank: overallRank(overall)
    };
  });
}


function matchNumber(matchName){
  const nums = String(matchName || "").match(/\d+/g);
  if(!nums || !nums.length) return 0;
  return Number(nums[0]);
}

function matchRoundsFromScore(score){
  const parts = String(score || "").split("-");
  if(parts.length !== 2) return 0;
  return Number(parts[0] || 0) + Number(parts[1] || 0);
}

function clutchText(wins, count){
  return `${wins || 0}/${count || 0}`;
}

function clutchRate(wins, count){
  return count ? Number(((wins / count) * 100).toFixed(1)) : 0;
}

function playerMvpScore(p){
  const clutchWins = Number(p.clutch_1v1_wins || 0) + Number(p.clutch_1v2_wins || 0);
  return (
    Number(p.kills || 0) * 2 +
    Number(p.assists || 0) +
    Number(p.damage || 0) / 100 +
    Number(p.entry_wins || 0) * 2 +
    clutchWins * 3 -
    Number(p.deaths || 0)
  );
}

function buildHtmlAwards(players, details){
  const map = {};

  (players || []).forEach(p=>{
    map[p.name] = {
      edo:0,
      round_edo:Number(p.round_edo || p.mvps || 0),
      clutch_wins:0,
      clutch_count:0,
      clutch_rate:0,
      clutch_text:"0/0"
    };
  });

  (details || []).forEach(m=>{
    const all = [...(m.team1_players || []), ...(m.team2_players || [])];
    if(!all.length) return;

    let best = null;
    let bestScore = -999999;

    all.forEach(p=>{
      const key = p.name;
      if(!map[key]){
        map[key] = {
          edo:0,
          round_edo:0,
          clutch_wins:0,
          clutch_count:0,
          clutch_rate:0,
          clutch_text:"0/0"
        };
      }

      const cw = Number(p.clutch_1v1_wins || 0) + Number(p.clutch_1v2_wins || 0);
      const cc = Number(p.clutch_1v1_count || 0) + Number(p.clutch_1v2_count || 0);

      map[key].clutch_wins += cw;
      map[key].clutch_count += cc;

      // Yeni script çalıştıysa match_details içinde round_edo/mvps gelir.
      // Eski JSON varsa players.json içindeki round_edo zaten yukarıda başlangıçta alınır.
      map[key].round_edo += Number(p.round_edo || p.mvps || 0);

      const score = playerMvpScore(p);
      if(score > bestScore){
        bestScore = score;
        best = key;
      }
    });

    if(best && map[best]) map[best].edo += 1;
  });

  Object.keys(map).forEach(k=>{
    map[k].round_edo = Number(map[k].round_edo || 0);
    map[k].clutch_rate = clutchRate(map[k].clutch_wins, map[k].clutch_count);
    map[k].clutch_text = clutchText(map[k].clutch_wins, map[k].clutch_count);
  });

  return map;
}

function enrichPlayersWithAwards(players, awards){
  return (players || []).map(p=>{
    const a = awards[p.name] || {};
    const roundEdo = Number(a.round_edo ?? p.round_edo ?? p.mvps ?? 0);

    return {
      ...p,
      edo: Number(a.edo || 0),
      round_edo: roundEdo,
      mvps: roundEdo,
      clutch_wins: Number(a.clutch_wins || 0),
      clutch_count: Number(a.clutch_count || 0),
      clutch_rate: Number(a.clutch_rate || 0),
      clutch_text: a.clutch_text || "0/0"
    };
  });
}

function clutchText(wins, count){
  return `${wins || 0}/${count || 0}`;
}

function clutchRate(wins, count){
  return count ? Number(((wins / count) * 100).toFixed(1)) : 0;
}

function playerMvpScore(p){
  const clutchWins = Number(p.clutch_1v1_wins || 0) + Number(p.clutch_1v2_wins || 0);
  return (
    Number(p.kills || 0) * 2 +
    Number(p.assists || 0) +
    Number(p.damage || 0) / 100 +
    Number(p.entry_wins || 0) * 2 +
    clutchWins * 3 -
    Number(p.deaths || 0)
  );
}





function getLimitedDetails(details, limit){
  return (details || [])
    .slice()
    .sort((a,b)=>matchNumber(b.match)-matchNumber(a.match))
    .slice(0,limit);
}

function getLast10Details(details){
  return getLimitedDetails(details, 10);
}

function getLast20Details(details){
  return getLimitedDetails(details, 20);
}

function getLimitedDetails(details, limit){
  return (details || [])
    .slice()
    .sort((a,b)=>matchNumber(b.match)-matchNumber(a.match))
    .slice(0,limit);
}

function getLast10Details(details){
  return getLimitedDetails(details, 10);
}

function getLast20Details(details){
  return getLimitedDetails(details, 20);
}

function buildLimitedPlayers(players, details, limit){
  return players.map(base=>{
    let appearances = [];

    (details || []).forEach(m=>{
      const teamPlayers = [...(m.team1_players || []), ...(m.team2_players || [])];
      const found = teamPlayers.find(p => p.name === base.name || displayName(p.name) === displayName(base.name));
      if(found){
        appearances.push({
          match: m.match,
          rounds: Number(m.rounds || matchRoundsFromScore(m.score) || 0),
          kills: Number(found.kills || 0),
          deaths: Number(found.deaths || 0),
          damage: Number(found.damage || 0),
          hs: Number(found.headshot_kills || 0),
          round_edo: Number(found.round_edo || found.mvps || 0),
          entry_count: Number(found.entry_count || 0),
          entry_wins: Number(found.entry_wins || 0),
          clutch_wins: Number(found.clutch_1v1_wins || 0) + Number(found.clutch_1v2_wins || 0),
          clutch_count: Number(found.clutch_1v1_count || 0) + Number(found.clutch_1v2_count || 0),
          result: (
            (Number(found.team || 0) === 1 && Number(m.team1_score || 0) > Number(m.team2_score || 0)) ||
            (Number(found.team || 0) === 2 && Number(m.team2_score || 0) > Number(m.team1_score || 0))
          ) ? "WIN" : (
            Number(m.team1_score || 0) === Number(m.team2_score || 0) ? "DRAW" : "LOSE"
          )
        });
      }
    });

    appearances.sort((a,b)=>matchNumber(b.match)-matchNumber(a.match));
    const last = appearances.slice(0,limit);

    const kills = last.reduce((s,x)=>s+x.kills,0);
    const deaths = last.reduce((s,x)=>s+x.deaths,0);
    const damage = last.reduce((s,x)=>s+x.damage,0);
    const hs = last.reduce((s,x)=>s+x.hs,0);
    const rounds = last.reduce((s,x)=>s+x.rounds,0);
    const roundEdo = last.reduce((s,x)=>s+Number(x.round_edo || 0),0);
    const entryCount = last.reduce((s,x)=>s+Number(x.entry_count || 0),0);
    const entryWins = last.reduce((s,x)=>s+Number(x.entry_wins || 0),0);
    const clutchCount = last.reduce((s,x)=>s+Number(x.clutch_count || 0),0);
    const clutchWins = last.reduce((s,x)=>s+Number(x.clutch_wins || 0),0);
    const wins = last.filter(x=>x.result === "WIN").length;

    return {
      ...base,
      kd: deaths ? Number((kills/deaths).toFixed(2)) : kills,
      adr: rounds ? Number((damage/rounds).toFixed(1)) : 0,
      matches: last.length,
      wins: wins,
      losses: Math.max(last.length - wins, 0),
      wr: last.length ? Number(((wins / last.length) * 100).toFixed(1)) : 0,
      winrate: last.length ? Number(((wins / last.length) * 100).toFixed(1)) : 0,
      hs_percent: kills ? Number(((hs/kills)*100).toFixed(1)) : 0,
      round_edo: roundEdo,
      mvps: roundEdo,
      entry_count: entryCount,
      entry_wins: entryWins,
      clutch_count: clutchCount,
      clutch_wins: clutchWins,
      clutch_rate: clutchCount ? Number(((clutchWins / clutchCount) * 100).toFixed(1)) : 0,
      clutch_text: `${clutchWins}/${clutchCount}`,
      rounds: rounds
    };
  });
}

function buildLast10Players(players, details){
  return buildLimitedPlayers(players, details, 10);
}

function buildLast20Players(players, details){
  return buildLimitedPlayers(players, details, 20);
}

function setStatsMode(mode){
  statsMode = mode;
  document.getElementById("allStatsBtn").classList.toggle("active", mode === "all");
  document.getElementById("last10StatsBtn").classList.toggle("active", mode === "last10");
  document.getElementById("last20StatsBtn").classList.toggle("active", mode === "last20");

  currentPlayers = mode === "all" ? allPlayers : (mode === "last20" ? last20Players : last10Players);
  const q = document.getElementById("search").value.toLowerCase().trim();
  filtered = currentPlayers.filter(p => displayName(String(p.name||"")).toLowerCase().includes(q) || String(p.name||"").toLowerCase().includes(q));
  sortBy(currentSort, true);
}

function setBuilderMode(mode){
  builderMode = mode;
  document.getElementById("builderAllBtn").classList.toggle("active", mode === "all");
  document.getElementById("builderLast10Btn").classList.toggle("active", mode === "last10");
  document.getElementById("builderLast20Btn").classList.toggle("active", mode === "last20");

  selectedPlayers = [];
  document.getElementById("teamsOutput").innerHTML = "";
  showBuilderMessage("");
  renderBuilderPlayers();
}

function playersForBuilder(){ return builderMode === "all" ? allPlayers : (builderMode === "last20" ? last20Players : last10Players); }

function renderPlayers(){
  const body = document.getElementById("playersBody");
  body.innerHTML = "";
  filtered.forEach((p,i)=>{
    const kdClass = p.kd >= 1.15 ? "good" : (p.kd < .85 ? "bad" : "mid");
    body.innerHTML += `
      <tr onclick="goProfile('${encodeURIComponent(p.name)}')">
        <td>${i+1}</td>
        <td class="player">🔫 ${displayName(p.name)}</td>
        <td>${safe(p.adr,0)}</td>
        <td class="${kdClass}">${safe(p.kd,0)}</td>
        <td>${safe(p.matches,0)}</td>
        <td class="wl-box"><span class="win-text">${winsOf(p)}</span>/<span class="loss-text">${lossesOf(p)}</span></td>
        <td class="${wrClass(wrOf(p))}">%${wrOf(p)}</td>
        <td>${safe(p.hs_percent,0)}%</td>
        <td>🏆 ${safe(p.edo,0)}</td>
        <td>⭐ ${safe(p.round_edo ?? p.mvps,0)}</td>
        <td>${safe(p.clutch_text,"0/0")}</td>
        <td>${safe(p.rounds,0)}</td>
        <td>
          <div>⚡ ${safe(p.overall,0)}</div>
          <div class="rank-badge">${safe(p.rank,"Bronze")}</div>
        </td>
      </tr>`;
  });
}

function renderMatches(matches){
  const el = document.getElementById("matches");
  el.innerHTML = "";

  matches
    .slice()
    .sort((a,b)=>matchNumber(b.match)-matchNumber(a.match))
    .forEach(m=>{
      const winnerName = m.winner == 1 ? m.team1_name : (m.winner == 2 ? m.team2_name : "Berabere");
      el.innerHTML += `
        <div class="match-card" onclick="location.href='match.html?match=${encodeURIComponent(m.match)}'">
          <div class="match-top">
            <div class="match-name">${m.match}</div>
            <div class="score">${m.score}</div>
          </div>
          <div class="meta">${safe(m.map,"")} ${m.timestamp ? "• " + m.timestamp : ""}</div>
          <div class="winner">Kazanan: ${winnerName}</div>
        </div>`;
    });
}

function sortBy(key, forceDesc=false){
  if(currentSort === key && !forceDesc) asc = !asc; else { currentSort = key; asc = false; }
  filtered.sort((a,b)=>{
    const av = typeof a[key] === "string" ? a[key].toLowerCase() : Number(a[key]||0);
    const bv = typeof b[key] === "string" ? b[key].toLowerCase() : Number(b[key]||0);
    if(av < bv) return asc ? -1 : 1;
    if(av > bv) return asc ? 1 : -1;
    return 0;
  });
  renderPlayers();
}

document.getElementById("search").addEventListener("input", e=>{
  const q = e.target.value.toLowerCase().trim();
  filtered = currentPlayers.filter(p => displayName(String(p.name||"")).toLowerCase().includes(q) || String(p.name||"").toLowerCase().includes(q));
  sortBy(currentSort, true);
});

function renderBuilderPlayers(){
  const el = document.getElementById("playerPills");
  if(!el) return;

  const pool = playersForBuilder().slice().sort((a,b)=>Number(b.adr||0)-Number(a.adr||0));

  el.innerHTML = pool.map(p=>{
    const active = selectedPlayers.some(x=>x.name === p.name) ? "active" : "";
    return `
      <div class="player-pill ${active}" onclick="togglePlayer('${encodeURIComponent(p.name)}')">
        <div class="pill-name">🔫 ${displayName(p.name)}</div>
        <div class="pill-stat">Overall: ${p.overall || 0} • WR: %${wrOf(p)} • ADR: ${p.adr || 0} • K/D: ${p.kd || 0}</div>
      </div>`;
  }).join("");

  updateSelectedCount();
}

function togglePlayer(encodedName){
  const name = decodeURIComponent(encodedName);
  const p = playersForBuilder().find(x=>x.name === name);
  if(!p) return;

  const exists = selectedPlayers.some(x=>x.name === name);

  if(exists){
    selectedPlayers = selectedPlayers.filter(x=>x.name !== name);
  }else{
    if(selectedPlayers.length >= 10){
      showBuilderMessage("En fazla 10 oyuncu seçebilirsin kankam.");
      return;
    }
    selectedPlayers.push(p);
  }

  document.getElementById("teamsOutput").innerHTML = "";
  showBuilderMessage("");
  renderBuilderPlayers();
}

function updateSelectedCount(){
  const el = document.getElementById("selectedCount");
  if(el) el.innerText = `Seçilen oyuncu: ${selectedPlayers.length}/10`;
}

function showBuilderMessage(msg){
  const el = document.getElementById("builderMessage");
  if(el) el.innerText = msg;
}

function clearSelection(){
  selectedPlayers = [];
  document.getElementById("teamsOutput").innerHTML = "";
  showBuilderMessage("");
  renderBuilderPlayers();
}

function shuffleArray(arr){
  const copy = [...arr];
  for(let i=copy.length-1;i>0;i--){
    const j = Math.floor(Math.random() * (i+1));
    [copy[i],copy[j]] = [copy[j],copy[i]];
  }
  return copy;
}

function playerBalanceValue(p, mode){
  const includeEdo = document.getElementById("edoBalanceMode")?.value === "with";
  const includeWr = document.getElementById("wrBalanceMode")?.value === "with";
  const base = Number(p[mode] || 0);

  const matches = Math.max(Number(p.matches || 1), 1);
  const edoRate = Number(p.round_edo ?? p.mvps ?? 0) / matches;
  const wrRate = wrOf(p) / 100;

  let score = base;

  if(includeEdo){
    if(mode === "adr") score += edoRate * 15;
    else if(mode === "kd") score += edoRate * 0.25;
    else if(mode === "overall") score += edoRate * 2;
  }

  if(includeWr){
    if(mode === "adr") score += wrRate * 20;
    else if(mode === "kd") score += wrRate * 0.35;
    else if(mode === "overall") score += wrRate * 6;
  }

  return score;
}

function teamScore(team, mode){
  return team.reduce((sum,p)=>sum + playerBalanceValue(p, mode), 0);
}

function teamAverage(team, mode){
  if(!team.length) return 0;
  return teamScore(team, mode) / team.length;
}

function buildTeams(){
  const mode = document.getElementById("balanceMode").value;

  if(!mode){
    showBuilderMessage("Önce ADR veya K/D kriterini seçmelisin.");
    return;
  }

  if(selectedPlayers.length !== 10){
    showBuilderMessage("Takım kurmak için tam 10 oyuncu seçmelisin.");
    return;
  }

  showBuilderMessage("");

  const shuffled = shuffleArray(selectedPlayers);
  const sorted = shuffled.sort((a,b)=>playerBalanceValue(b, mode)-playerBalanceValue(a, mode));

  let teamA = [];
  let teamB = [];

  sorted.forEach(p=>{
    if(teamA.length >= 5){ teamB.push(p); return; }
    if(teamB.length >= 5){ teamA.push(p); return; }

    const scoreA = teamScore(teamA, mode);
    const scoreB = teamScore(teamB, mode);

    if(scoreA <= scoreB) teamA.push(p);
    else teamB.push(p);
  });

  for(let attempt=0; attempt<25; attempt++){
    const ai = Math.floor(Math.random()*5);
    const bi = Math.floor(Math.random()*5);

    const newA = [...teamA];
    const newB = [...teamB];

    [newA[ai], newB[bi]] = [newB[bi], newA[ai]];

    const oldDiff = Math.abs(teamAverage(teamA, mode) - teamAverage(teamB, mode));
    const newDiff = Math.abs(teamAverage(newA, mode) - teamAverage(newB, mode));

    if(newDiff <= oldDiff + 0.05){
      teamA = newA;
      teamB = newB;
    }
  }

  renderGeneratedTeams(teamA, teamB, mode);
}

function renderGeneratedTeams(teamA, teamB, mode){
  const label = mode === "adr" ? "ADR" : (mode === "kd" ? "K/D" : "Overall");
  const includeEdo = document.getElementById("edoBalanceMode")?.value === "with";
  const includeWr = document.getElementById("wrBalanceMode")?.value === "with";
  const avgA = teamAverage(teamA, mode).toFixed(mode === "adr" ? 1 : 2);
  const avgB = teamAverage(teamB, mode).toFixed(mode === "adr" ? 1 : 2);

  function renderTeam(title, team, avg){
    return `
      <div class="generated-team">
        <h3>${title}</h3>
        ${team.map(p=>`
          <div class="team-line">
            <span>${displayName(p.name)}</span>
            <b>${label}: ${p[mode] || 0}${includeEdo ? " • ⭐ " + (p.round_edo ?? p.mvps ?? 0) : ""}${includeWr ? " • WR %" + wrOf(p) : ""}</b>
          </div>
        `).join("")}
        <div class="team-avg">Ortalama ${label}: ${avg}${includeEdo ? " • EDO dahil" : ""}${includeWr ? " • WR dahil" : ""}</div>
      </div>`;
  }

  document.getElementById("teamsOutput").innerHTML =
    renderTeam("🟢 Team A", teamA, avgA) +
    renderTeam("🔴 Team B", teamB, avgB);
}

function toggleMatches(){
  const matchesEl = document.getElementById("matches");
  const btn = document.getElementById("matchesToggle");

  matchesEl.classList.toggle("collapsed");

  if(matchesEl.classList.contains("collapsed")){
    btn.innerText = "Maçları Göster";
  }else{
    btn.innerText = "Maçları Gizle";
  }
}

function goProfile(name){ location.href = "profile.html?player=" + name; }
</script>
